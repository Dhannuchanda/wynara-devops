---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow required ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "80"
    - "443"

- name: Enable UFW with deny incoming policy
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
