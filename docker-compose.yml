services:
  web:
    image: ${WYNARA_IMAGE:-wynara}:${WYNARA_TAG:-latest}
    build:
      context: .
      target: runtime
    env_file:
      - .env
    volumes:
      - wynara_uploads:/app/uploads
      - wynara_private_uploads:/app/private_uploads
      - wynara_runtime:/app/runtime
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test:
        - CMD
        - wget
        - --no-verbose
        - --tries=1
        - --no-check-certificate
        - --spider
        - https://127.0.0.1/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  wynara_uploads:
  wynara_private_uploads:
  wynara_runtime:
