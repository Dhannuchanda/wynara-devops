<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Result - WAPL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: var(--text-main);
            min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 2rem;
            background-image:
                radial-gradient(at 40% 20%, hsla(260,100%,93%,1) 0px, transparent 50%),
                radial-gradient(at 80% 0%, hsla(189,100%,96%,1) 0px, transparent 50%);
        }

        .result-container { max-width: 600px; width: 100%; }

        .back-link {
            display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted);
            text-decoration: none; font-size: 0.9rem; font-weight: 500; margin-bottom: 1.5rem;
        }
        .back-link:hover { color: #667eea; }

        .result-card {
            background: white; border-radius: 20px; overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }

        .result-header {
            padding: 30px; text-align: center;
        }
        .result-header.passed {
            background: linear-gradient(135deg, #10b981, #059669);
        }
        .result-header.failed {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }
        .result-header .badge { color: white; }
        .result-header .icon { font-size: 3rem; margin-bottom: 8px; }
        .result-header h1 { font-size: 1.6rem; font-weight: 800; color: white; }
        .result-header p { color: rgba(255,255,255,0.85); font-size: 0.9rem; margin-top: 4px; }

        .result-body { padding: 30px; }

        .score-ring {
            width: 160px; height: 160px; margin: 0 auto 24px; position: relative;
        }
        .score-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .score-ring .bg { fill: none; stroke: #e5e7eb; stroke-width: 10; }
        .score-ring .fg { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
        .score-ring .fg.pass { stroke: #10b981; }
        .score-ring .fg.fail { stroke: #ef4444; }
        .score-center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center;
        }
        .score-center .pct { font-size: 2rem; font-weight: 800; color: var(--text-main); }
        .score-center .label { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; }

        .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
        .detail-item {
            background: #f9fafb; border-radius: 12px; padding: 14px;
        }
        .detail-item label { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .detail-item p { font-size: 1.05rem; font-weight: 600; margin-top: 4px; }

        .remarks-box {
            background: #eef2ff; border-radius: 12px; padding: 14px; border-left: 4px solid #667eea;
        }
        .remarks-box h4 { font-size: 0.8rem; color: #4338ca; margin-bottom: 4px; }
        .remarks-box p { font-size: 0.9rem; color: #3730a3; line-height: 1.5; }

        .result-footer {
            border-top: 1px solid #f3f4f6; padding: 16px 30px; text-align: center;
            font-size: 0.8rem; color: var(--text-muted);
        }

        .loading { text-align: center; padding: 60px; color: var(--text-muted); }

        @media (max-width: 500px) {
            .detail-grid { grid-template-columns: 1fr; }
            body { padding: 1rem; }
        }
    </style>
</head>
<body>
    <div class="result-container">
        <a href="/exam" class="back-link">← Back to Exam Dashboard</a>
        <div id="resultContent" class="loading"><p>Loading result...</p></div>
    </div>

    <script>
        const resultId = {{ result_id }};

        document.addEventListener('DOMContentLoaded', () => {
            fetch(`/api/exam/result/${resultId}`)
                .then(r => r.json())
                .then(data => {
                    if (data.error) {
                        document.getElementById('resultContent').innerHTML =
                            `<p style="color:#ef4444;">Error: ${data.error}</p>`;
                        return;
                    }
                    renderResult(data);
                })
                .catch(() => {
                    document.getElementById('resultContent').innerHTML =
                        '<p style="color:#ef4444;">Failed to load result</p>';
                });
        });

        function renderResult(data) {
            const r = data.result;
            const pct = r.max_marks > 0 ? Math.round((r.marks_obtained / r.max_marks) * 100) : 0;
            const passed = !!r.passed;
            const circumference = 2 * Math.PI * 65;
            const offset = circumference - (pct / 100) * circumference;

            document.getElementById('resultContent').innerHTML = `
                <div class="result-card">
                    <div class="result-header ${passed ? 'passed' : 'failed'}">
                        <div class="badge">
                            <div class="icon">${passed ? '🎉' : '📋'}</div>
                            <h1>${passed ? 'Congratulations! You Passed' : 'Better Luck Next Time'}</h1>
                            <p>${r.domain_name} – ${r.title || 'Exam'}</p>
                        </div>
                    </div>
                    <div class="result-body">
                        <div class="score-ring">
                            <svg viewBox="0 0 160 160">
                                <circle class="bg" cx="80" cy="80" r="65"></circle>
                                <circle class="fg ${passed ? 'pass' : 'fail'}" cx="80" cy="80" r="65"
                                    stroke-dasharray="${circumference}"
                                    stroke-dashoffset="${offset}">
                                </circle>
                            </svg>
                            <div class="score-center">
                                <div class="pct">${pct}%</div>
                                <div class="label">Score</div>
                            </div>
                        </div>

                        <div class="detail-grid">
                            <div class="detail-item">
                                <label>Marks Obtained</label>
                                <p>${r.marks_obtained} / ${r.max_marks}</p>
                            </div>
                            <div class="detail-item">
                                <label>Passing Marks</label>
                                <p>${r.passing_marks}</p>
                            </div>
                            <div class="detail-item">
                                <label>Result</label>
                                <p style="color: ${passed ? '#10b981' : '#ef4444'}">${passed ? 'PASSED' : 'FAILED'}</p>
                            </div>
                            <div class="detail-item">
                                <label>Exam Date</label>
                                <p>${formatDate(r.exam_date)}</p>
                            </div>
                        </div>

                        ${r.remarks ? `
                        <div class="remarks-box">
                            <h4>📝 Remarks from Admin</h4>
                            <p>${r.remarks}</p>
                        </div>` : ''}
                    </div>
                    <div class="result-footer">
                        Result published on ${formatDate(r.created_at)}
                    </div>
                </div>`;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            try {
                const d = new Date(dateStr);
                return d.toLocaleDateString('en-IN', { year: 'numeric', month: 'long', day: 'numeric' });
            } catch { return dateStr; }
        }
    </script>
</body>
</html>
