<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Admin Reset</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f7fb;
            --panel: #ffffff;
            --text: #14213d;
            --muted: #5b6475;
            --accent: #1f2b44;
            --accent-soft: #e7ecf5;
            --border: #d7deea;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef3fb 0%, #f8fafc 45%, #eef4ff 100%);
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 560px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(20, 33, 61, 0.12);
            padding: 32px;
        }
        h1 { margin: 0 0 10px; font-size: 30px; }
        p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; }
        label { display: block; font-weight: 700; margin-bottom: 8px; }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            margin-bottom: 16px;
            outline: none;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(31, 43, 68, 0.08); }
        .btn {
            width: 100%;
            padding: 14px 18px;
            border: 0;
            border-radius: 12px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
        .btn:hover { opacity: 0.95; }
        .links {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        a { color: var(--accent); text-decoration: none; font-weight: 700; }
        .note {
            margin-top: 18px;
            padding: 14px 16px;
            background: var(--accent-soft);
            border-radius: 12px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }
        .message {
            margin-top: 14px;
            font-size: 14px;
            font-weight: 700;
        }
        .message.success { color: #1f7a3f; }
        .message.error { color: #b42318; }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-overrides.css') }}">
</head>
<body>
    <main class="card">
        <h1>Set a new password</h1>
        <p>Enter the OTP sent to your email and choose a new password for your admin account.</p>

        <form id="adminResetForm">
            <label for="email">Admin Email</label>
            <input id="email" type="email" placeholder="admin@example.com" autocomplete="email" required>

            <label for="otp">OTP</label>
            <input id="otp" type="text" placeholder="123456" inputmode="numeric" autocomplete="one-time-code" required>

            <label for="password">New Password</label>
            <input id="password" type="password" placeholder="Enter a new password" autocomplete="new-password" required>

            <button class="btn" type="submit">Reset Password</button>
        </form>

        <div class="note">
            Use the same email that received the OTP. For super admin accounts, the same flow applies.
        </div>

        <div id="message" class="message" aria-live="polite"></div>

        <div class="links">
            <a href="/secure-admin-panel/wapl/forgot-password">Request a new OTP</a>
            <a href="/secure-admin-panel/wapl/login">Back to login</a>
        </div>
    </main>

    <script>
        const form = document.getElementById('adminResetForm');
        const message = document.getElementById('message');
        const submitButton = form.querySelector('button[type="submit"]');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            message.textContent = '';
            message.className = 'message';
            submitButton.disabled = true;
            submitButton.textContent = 'Resetting...';

            try {
                const response = await fetch('/api/admin/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        otp_code: document.getElementById('otp').value,
                        new_password: document.getElementById('password').value
                    })
                });
                const payload = await response.json();

                if (!response.ok) {
                    throw new Error(payload.error || 'Unable to reset password');
                }

                message.textContent = payload.message || 'Password reset successful.';
                message.classList.add('success');
                form.reset();
            } catch (error) {
                message.textContent = error.message;
                message.classList.add('error');
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
