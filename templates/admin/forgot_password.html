<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Password Reset</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f7fb;
            --panel: #ffffff;
            --text: #14213d;
            --muted: #5b6475;
            --accent: #1f2b44;
            --accent-soft: #e7ecf5;
            --border: #d7deea;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef3fb 0%, #f8fafc 45%, #eef4ff 100%);
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 520px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(20, 33, 61, 0.12);
            padding: 32px;
        }
        h1 { margin: 0 0 10px; font-size: 30px; }
        p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; }
        label { display: block; font-weight: 700; margin-bottom: 8px; }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            margin-bottom: 16px;
            outline: none;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(31, 43, 68, 0.08); }
        .btn {
            width: 100%;
            padding: 14px 18px;
            border: 0;
            border-radius: 12px;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }
        .btn:hover { opacity: 0.95; }
        .links {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        a { color: var(--accent); text-decoration: none; font-weight: 700; }
        .note {
            margin-top: 18px;
            padding: 14px 16px;
            background: var(--accent-soft);
            border-radius: 12px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.5;
        }
        .message {
            margin-top: 14px;
            font-size: 14px;
            font-weight: 700;
        }
        .message.success { color: #1f7a3f; }
        .message.error { color: #b42318; }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin-overrides.css') }}">
</head>
<body>
    <main class="card">
        <h1>Reset admin password</h1>
        <p>Enter the email address for your admin account. We will send a one-time password to verify the reset request.</p>

        <form id="adminForgotForm">
            <label for="email">Admin Email</label>
            <input id="email" type="email" placeholder="admin@example.com" autocomplete="email" required>
            <button class="btn" type="submit">Send OTP</button>
        </form>

        <div class="note">
            This flow is for admin and super admin accounts only. The OTP will expire automatically.
        </div>

        <div id="message" class="message" aria-live="polite"></div>
        <div id="otpMessage" class="message" aria-live="polite" style="display:none;"></div>

        <div class="links">
            <a href="/secure-admin-panel/wapl/login">Back to login</a>
            <a href="/secure-admin-panel/wapl/reset-password">I already have an OTP</a>
        </div>
    </main>

    <script>
        const form = document.getElementById('adminForgotForm');
        const message = document.getElementById('message');
        const otpMessage = document.getElementById('otpMessage');
        const submitButton = form.querySelector('button[type="submit"]');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            message.textContent = '';
            message.className = 'message';
            submitButton.disabled = true;
            submitButton.textContent = 'Sending...';

            try {
                const response = await fetch('/api/admin/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('email').value })
                });
                const payload = await response.json();

                if (!response.ok) {
                    throw new Error(payload.error || 'Unable to send OTP');
                }

                message.textContent = payload.message || 'OTP sent successfully.';
                message.classList.add('success');
                if (payload.otp_code) {
                    otpMessage.style.display = 'block';
                    otpMessage.className = 'message success';
                    otpMessage.innerHTML = `Dev OTP: <strong>${payload.otp_code}</strong>${payload.dev_note ? `<br><span style="font-weight:400;">${payload.dev_note}</span>` : ''}`;
                } else {
                    otpMessage.style.display = 'none';
                    otpMessage.textContent = '';
                }
            } catch (error) {
                message.textContent = error.message;
                message.classList.add('error');
                otpMessage.style.display = 'none';
                otpMessage.textContent = '';
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Send OTP';
            }
        });
    </script>
</body>
</html>
